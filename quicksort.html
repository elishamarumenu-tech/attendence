<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quicksort Animation</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #eee; }
  button:active { transform: scale(0.98); }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #555;
  }
  #boxes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px 0;
  }
  .box-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .box {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
  }
  .box.pivot { background: #fdf0d5; border-color: #e0a939; color: #8a5a0a; }
  .box.compare { background: #e3edfb; border-color: #4a90d9; color: #1a5aa0; }
  .box.sorted { background: #e2f3e5; border-color: #4caf6d; color: #2a7a45; }
  .index-label {
    font-size: 11px;
    color: #999;
  }
  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 12px;
    font-size: 12px;
    color: #555;
    flex-wrap: wrap;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
  .swatch.pivot { background: #fdf0d5; border: 1px solid #e0a939; }
  .swatch.compare { background: #e3edfb; border: 1px solid #4a90d9; }
  .swatch.sorted { background: #e2f3e5; border: 1px solid #4caf6d; }
  #status {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #555;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Quicksort animation</h1>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn">↺ Reset</button>
    <button id="shuffleBtn">New array</button>
    <label class="speed-control">
      Speed
      <input type="range" id="speed" min="1" max="10" value="6" step="1">
    </label>
  </div>

  <div id="boxes"></div>

  <div class="legend">
    <span><span class="swatch pivot"></span>Pivot</span>
    <span><span class="swatch compare"></span>Comparing</span>
    <span><span class="swatch sorted"></span>Sorted</span>
  </div>

  <div id="status"></div>
</div>

<script>
(function(){
  const N = 7;
  let arr = [];
  let steps = [];
  let stepIndex = 0;
  let playing = false;
  let playTimer = null;
  const sortedIdx = new Set();

  function randomArray(){
    const pool = [];
    for(let i=10;i<=99;i++) pool.push(i);
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    return pool.slice(0, N);
  }

  function buildSteps(input){
    const a = input.slice();
    const s = [];
    function partition(lo, hi){
      const pivot = a[hi];
      s.push({type:'pivot', array:a.slice(), pivot:hi, lo, hi});
      let i = lo;
      for(let j=lo;j<hi;j++){
        s.push({type:'compare', array:a.slice(), pivot:hi, i, j, lo, hi});
        if(a[j] < pivot){
          [a[i],a[j]] = [a[j],a[i]];
          s.push({type:'swap', array:a.slice(), pivot:hi, i, j, lo, hi});
          i++;
        }
      }
      [a[i],a[hi]] = [a[hi],a[i]];
      s.push({type:'swap', array:a.slice(), pivot:hi, i, j:hi, lo, hi});
      s.push({type:'placed', array:a.slice(), placed:i, lo, hi});
      return i;
    }
    function qs(lo, hi){
      if(lo >= hi){
        if(lo === hi) s.push({type:'placed', array:a.slice(), placed:lo, lo, hi});
        return;
      }
      const p = partition(lo, hi);
      qs(lo, p-1);
      qs(p+1, hi);
    }
    qs(0, a.length-1);
    s.push({type:'done', array:a.slice()});
    return s;
  }

  const boxesEl = document.getElementById('boxes');
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('playBtn');

  function render(){
    const step = steps[stepIndex] || {array:arr, type:'init'};
    const data = step.array;
    boxesEl.innerHTML = '';
    data.forEach((v, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'box-wrap';

      const box = document.createElement('div');
      box.className = 'box';
      if(step.type === 'done' || sortedIdx.has(idx)) box.classList.add('sorted');
      if(step.pivot === idx && step.type !== 'placed') box.classList.add('pivot');
      if((step.i === idx || step.j === idx) && (step.type === 'compare' || step.type === 'swap')) box.classList.add('compare');
      box.textContent = v;

      const label = document.createElement('div');
      label.className = 'index-label';
      label.textContent = idx;

      wrap.appendChild(box);
      wrap.appendChild(label);
      boxesEl.appendChild(wrap);
    });

    let msg = '';
    if(step.type === 'pivot') msg = 'Picking pivot for range [' + step.lo + ', ' + step.hi + ']';
    else if(step.type === 'compare') msg = 'Comparing element with pivot';
    else if(step.type === 'swap') msg = 'Swapping elements';
    else if(step.type === 'placed'){ sortedIdx.add(step.placed); msg = 'Pivot placed in final position'; }
    else if(step.type === 'done'){ for(let k=0;k<data.length;k++) sortedIdx.add(k); msg = 'Array fully sorted'; }
    else msg = 'Ready to sort';
    statusEl.textContent = msg;
  }

  function reset(){
    steps = buildSteps(arr);
    stepIndex = 0;
    sortedIdx.clear();
    pause();
    render();
  }

  function stepForward(){
    if(stepIndex < steps.length - 1){
      stepIndex++;
      render();
    } else {
      pause();
    }
  }

  function play(){
    if(playing) return;
    playing = true;
    playBtn.textContent = '⏸ Pause';
    const speed = document.getElementById('speed');
    const tick = () => {
      if(!playing) return;
      if(stepIndex >= steps.length - 1){ pause(); return; }
      stepForward();
      const delay = 650 - (parseInt(speed.value) * 55);
      playTimer = setTimeout(tick, Math.max(delay, 60));
    };
    tick();
  }

  function pause(){
    playing = false;
    playBtn.textContent = '▶ Play';
    if(playTimer) clearTimeout(playTimer);
  }

  playBtn.addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('stepBtn').addEventListener('click', () => { pause(); stepForward(); });
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('shuffleBtn').addEventListener('click', () => { arr = randomArray(); reset(); });

  arr = randomArray();
  reset();
})();
</script>
</body>
</html>
