<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge Sort — Bar Chart Animation</title>
<style>
  :root{
    --bg:#13e490;
    --panel:#e24b14;
    --panel2:#1E2723;
    --line:#2B3733;

    --text:#EDF2EF;
    --muted:#8FA39A;

    --accent:#38BDF8;   /* divide */
    --compare:#FBBF24;  /* merging / comparing */
    --write:#4ADE80;    /* just placed */
    --done:#4ADE80;

    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 85% -10%, #142a22 0%, transparent 55%),
      radial-gradient(700px 400px at 5% 0%, #101c17 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; padding:28px 20px 40px;
    min-height:100vh;
  }

  .wrap{width:100%; max-width:1080px;}

  header{margin-bottom:20px;}
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,.18);}
  h1{font-size:30px; font-weight:650; margin:0 0 6px; letter-spacing:-.01em;text-align: center;color: #e83908;}
  .sub{color:var(--muted); font-size:23px; margin:0; max-width:640px; line-height:1.5;color:greenyellow}

  .panel{
    background:linear-gradient(180deg, var(--panel), #101613);
    border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.3);
  }

  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .field{display:flex; flex-direction:column; gap:4px;}
  label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-family:var(--mono);}

  input[type=text], input[type=number]{
    padding:9px 11px; border-radius:8px; border:1px solid var(--line);
    background:#0B100E; color:var(--text); font-size:13.5px; font-family:var(--mono);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]{width:260px;}
  input[type=number]{width:70px;}
  input[type=text]:focus, input[type=number]:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,.15);}

  button{
    padding:9px 15px; border-radius:8px; border:1px solid var(--line);
    background:#182120; color:var(--text); font-size:13px; font-weight:500; cursor:pointer;
    transition:background .15s, border-color .15s, transform .05s;
  }
  button:hover{background:#202B29; border-color:#3B4C46;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#06141C; font-weight:650;}
  button.primary:hover{background:#67CDF9;}
  button.ghost{background:transparent;}

  .spacer{flex:1;}
  .divider{width:1px; height:28px; background:var(--line); margin:0 6px;}
  .playback{display:flex; align-items:center; gap:8px;}
  input[type=range]{accent-color:var(--accent); width:130px;}

  /* ---- chart ---- */
  .chart-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px 20px 12px; box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .depth-row{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    font-family:var(--mono); font-size:11px; color:var(--muted);
  }
  .depth-badge{
    padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:#0F1613;
  }
  .chart{
    position:relative; display:flex; align-items:flex-end; gap:4px;
    height:230px; padding:0 4px;
  }
  .bar-col{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    height:100%; position:relative;
  }
  .bar{
    width:100%; border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg, #2C3B36, #1B2622);
    border:1.5px solid #3A4C45;
    transition:height .32s cubic-bezier(.4,0,.2,1), background .25s, border-color .25s, transform .2s;
    position:relative;
  }
  .bar-val{
    font-family:var(--mono); font-size:20px; font-weight:600; color:var(--muted);
    margin-bottom:5px; transition:color .25s;color:greenyellow
  }
  .bar-idx{
    font-family:var(--mono); font-size:9px; color:#54655D; margin-top:6px;
  }
  .range-band{
    position:absolute; bottom:-8px; height:4px; border-radius:3px;
    transition:left .3s, width .3s, background .25s, opacity .25s;
    opacity:0;
  }

  .status{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:13px 16px; font-size:13.5px; min-height:20px; display:flex; align-items:center; gap:10px;
    margin-top:14px; font-family:var(--mono); color:var(--text);
  }
  .status .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 0 4px rgba(56,189,248,.15);}

  .legend{display:flex; gap:18px; font-size:12px; color:var(--muted); margin-top:20px; flex-wrap:wrap; font-family:var(--mono);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:22px; height:6px; border-radius:3px; display:inline-block;}

  ::selection{background:rgba(56,189,248,.3);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"></div>
    <h1>Merge Sort</h1>
    <p class="sub">ADITYA UNIVERSITY ADSA</p>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label>Array</label>
        <input type="text" id="arrInput" placeholder="e.g. 8, 3, 5, 1, 9, 2" />
      </div>
      <div class="field">
        <label>Size</label>
        <input type="number" id="sizeInput" value="10" min="2" max="20" />
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; justify-content:flex-end;">
        <button id="randomBtn">Randomize</button>
      </div>
      <div class="divider"></div>
      <button class="primary" id="sortBtn">Sort</button>
      <button class="ghost" id="clearBtn">Clear</button>
      <div class="spacer"></div>
      <div class="playback">
        <label style="margin-right:2px;">Speed</label>
        <input type="range" id="speed" min="1" max="4" value="2" step="1">
        <button id="prevBtn" title="Previous step">⏮</button>
        <button id="playBtn" title="Play / pause">▶</button>
        <button id="nextBtn" title="Next step">⏭</button>
      </div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="depth-row">
      <span>Recursion depth</span>
      <span class="depth-badge" id="depthBadge">–</span>
    </div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <div id="statusText">Enter an array (or randomize one) and press Sort to begin.</div>
  </div>

  <div class="legend">
    <span><i class="sw" style="background:#38BDF8"></i>active range — dividing</span>
    <span><i class="sw" style="background:#FBBF24"></i>active range — merging</span>
    <span><i class="sw" style="background:#4ADE80"></i>value just placed</span>
    <span><i class="sw" style="background:#4ADE80;opacity:.4"></i>fully sorted</span>
  </div>
</div>

<script>
/* ---------- Merge sort core, recorded as flat-array steps ---------- */
let arr = [];
let steps = [];
let maxDepthSeen = 0;

function pushStep(msg, opts){
  steps.push({
    arrSnap: arr.slice(),
    msg,
    range:   (opts && opts.range)   || null,   // [l, r]
    phase:   (opts && opts.phase)   || null,   // 'divide' | 'compare' | 'write' | 'merged' | 'base' | 'done'
    writeIdx:(opts && opts.writeIdx) ?? null,
    depth:   (opts && opts.depth)   ?? 0
  });
}

function mergeSortRec(l, r, depth){
  maxDepthSeen = Math.max(maxDepthSeen, depth);
  if(l >= r){
    pushStep(`Position ${l} — single element, already sorted`, {range:[l,l], phase:'base', depth});
    return;
  }
  const mid = Math.floor((l+r)/2);
  pushStep(`Dividing range [${l}..${r}] at midpoint ${mid}`, {range:[l,r], phase:'divide', depth});
  mergeSortRec(l, mid, depth+1);
  mergeSortRec(mid+1, r, depth+1);
  merge(l, mid, r, depth);
}

function merge(l, mid, r, depth){
  const left = arr.slice(l, mid+1);
  const right = arr.slice(mid+1, r+1);
  pushStep(`Merging [${left.join(', ')}] with [${right.join(', ')}]`, {range:[l,r], phase:'compare', depth});

  let i=0, j=0, k=l;
  while(i < left.length && j < right.length){
    if(left[i] <= right[j]){
      arr[k] = left[i];
      pushStep(`${left[i]} ≤ ${right[j]} — place ${left[i]} at position ${k}`, {range:[l,r], phase:'write', writeIdx:k, depth});
      i++;
    } else {
      arr[k] = right[j];
      pushStep(`${right[j]} < ${left[i]} — place ${right[j]} at position ${k}`, {range:[l,r], phase:'write', writeIdx:k, depth});
      j++;
    }
    k++;
  }
  while(i < left.length){ arr[k]=left[i]; pushStep(`Place remaining ${left[i]} at position ${k}`, {range:[l,r], phase:'write', writeIdx:k, depth}); i++; k++; }
  while(j < right.length){ arr[k]=right[j]; pushStep(`Place remaining ${right[j]} at position ${k}`, {range:[l,r], phase:'write', writeIdx:k, depth}); j++; k++; }

  pushStep(`Range [${l}..${r}] sorted: [${arr.slice(l,r+1).join(', ')}]`, {range:[l,r], phase:'merged', depth});
}

function runSort(values){
  arr = values.slice();
  steps = [];
  maxDepthSeen = 0;
  mergeSortRec(0, arr.length-1, 0);
  pushStep(`Array fully sorted: [${arr.join(', ')}]`, {range:[0,arr.length-1], phase:'done', depth:0});
}

/* ---------- rendering ---------- */
const chartEl = document.getElementById('chart');
let barEls = [], valEls = [], bandEls = [];

function buildChart(n){
  chartEl.innerHTML = '';
  barEls = []; valEls = []; bandEls = [];
  for(let idx=0; idx<n; idx++){
    const col = document.createElement('div');
    col.className = 'bar-col';

    const val = document.createElement('div');
    val.className = 'bar-val';
    col.appendChild(val);

    const bar = document.createElement('div');
    bar.className = 'bar';
    col.appendChild(bar);

    const band = document.createElement('div');
    band.className = 'range-band';
    band.style.left = '0%';
    band.style.width = '100%';
    col.appendChild(band);

    const idxLbl = document.createElement('div');
    idxLbl.className = 'bar-idx';
    idxLbl.textContent = idx;
    col.appendChild(idxLbl);

    chartEl.appendChild(col);
    barEls.push(bar); valEls.push(val); bandEls.push(band);
  }
}

const PHASE_COLOR = {
  divide: '#38BDF8',
  compare: '#FBBF24',
  merged: '#4ADE80',
  done: '#4ADE80'
};

function render(step){
  const values = step.arrSnap;
  if(barEls.length !== values.length) buildChart(values.length);

  const maxVal = Math.max(...values, 1);
  values.forEach((v, idx)=>{
    const pct = 12 + (v / maxVal) * 82;
    barEls[idx].style.height = pct + '%';
    valEls[idx].textContent = v;

    let borderColor = '#3A4C45', bg = 'linear-gradient(180deg, #2C3B36, #1B2622)', valColor = '#8FA39A';
    if(step.phase === 'done'){
      borderColor = '#4ADE80'; bg = 'linear-gradient(180deg, #285240, #1B2E24)'; valColor = '#4ADE80';
    } else if(step.range && idx >= step.range[0] && idx <= step.range[1]){
      if(step.phase === 'divide'){ borderColor = '#38BDF8'; bg = 'linear-gradient(180deg, #1F3B4A, #17262E)'; valColor = '#38BDF8'; }
      else if(step.phase === 'compare'){ borderColor = '#FBBF24'; bg = 'linear-gradient(180deg, #4A3E1A, #2E2812)'; valColor = '#FBBF24'; }
      else if(step.phase === 'merged'){ borderColor = '#4ADE80'; bg = 'linear-gradient(180deg, #285240, #1B2E24)'; valColor = '#4ADE80'; }
      else if(step.phase === 'write'){ borderColor = '#3A4C45'; bg = 'linear-gradient(180deg, #2C3B36, #1B2622)'; valColor = '#8FA39A'; }
    }
    if(step.phase === 'write' && step.writeIdx === idx){
      borderColor = '#4ADE80'; bg = 'linear-gradient(180deg, #2E6B4C, #1E3B2C)'; valColor = '#4ADE80';
      barEls[idx].style.transform = 'scaleY(1.03)';
    } else {
      barEls[idx].style.transform = 'scaleY(1)';
    }

    barEls[idx].style.borderColor = borderColor;
    barEls[idx].style.background = bg;
    valEls[idx].style.color = valColor;

    // range band under the active segment
    const band = bandEls[idx];
    if(step.range && idx >= step.range[0] && idx <= step.range[1] && step.phase !== 'base'){
      band.style.opacity = 1;
      band.style.background = PHASE_COLOR[step.phase] || '#38BDF8';
    } else {
      band.style.opacity = 0;
    }
  });

  document.getElementById('depthBadge').textContent =
    step.phase === 'done' ? 'complete' : `${step.depth} / ${maxDepthSeen}`;
}

/* ---------- playback ---------- */
let curStep = 0;
let playing = false;
let timer = null;

function speedMs(){
  const v = Number(document.getElementById('speed').value);
  return {1:1200, 2:750, 3:430, 4:220}[v];
}

function goto(i){
  if(steps.length===0) return;
  curStep = Math.max(0, Math.min(steps.length-1, i));
  const s = steps[curStep];
  render(s);
  updateStatus(s.msg, curStep, steps.length);
  document.getElementById('prevBtn').disabled = curStep===0;
  document.getElementById('nextBtn').disabled = curStep===steps.length-1;
}

function updateStatus(msg, idx, total){
  const t = document.getElementById('statusText');
  t.textContent = (idx!==undefined) ? `Step ${idx+1}/${total} — ${msg}` : msg;
}

function play(){
  if(steps.length===0) return;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  clearInterval(timer);
  timer = setInterval(()=>{
    if(curStep >= steps.length-1){ pause(); return; }
    goto(curStep+1);
  }, speedMs());
}
function pause(){
  playing = false;
  document.getElementById('playBtn').textContent = '▶';
  clearInterval(timer);
}

document.getElementById('playBtn').onclick = ()=> playing ? pause() : play();
document.getElementById('prevBtn').onclick = ()=>{ pause(); goto(curStep-1); };
document.getElementById('nextBtn').onclick = ()=>{ pause(); goto(curStep+1); };
document.getElementById('speed').oninput = ()=>{ if(playing){ play(); } };

function parseArray(text){
  return text.split(',')
    .map(s=>s.trim())
    .filter(s=>s.length>0)
    .map(Number)
    .filter(n=>!isNaN(n));
}

function startSort(values){
  if(values.length === 0) return;
  if(values.length > 20) values = values.slice(0,20);
  pause();
  buildChart(values.length);
  runSort(values);
  curStep = -1;
  goto(0);
  play();
}

document.getElementById('sortBtn').onclick = ()=>{
  const raw = document.getElementById('arrInput').value.trim();
  let values;
  if(raw.length>0){
    values = parseArray(raw);
  } else {
    const n = Math.max(2, Math.min(20, Number(document.getElementById('sizeInput').value) || 10));
    values = Array.from({length:n}, ()=>Math.floor(Math.random()*90)+10);
    document.getElementById('arrInput').value = values.join(', ');
  }
  startSort(values);
};

document.getElementById('randomBtn').onclick = ()=>{
  const n = Math.max(2, Math.min(20, Number(document.getElementById('sizeInput').value) || 10));
  const values = Array.from({length:n}, ()=>Math.floor(Math.random()*90)+10);
  document.getElementById('arrInput').value = values.join(', ');
  startSort(values);
};

document.getElementById('clearBtn').onclick = ()=>{
  steps = []; curStep = 0; pause();
  document.getElementById('arrInput').value = '';
  chartEl.innerHTML = '';
  barEls = []; valEls = []; bandEls = [];
  document.getElementById('depthBadge').textContent = '–';
  updateStatus('Cleared. Enter an array or randomize one to begin.');
};

document.getElementById('arrInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('sortBtn').click();
});

// initial demo array
(function init(){
  const values = Array.from({length:10}, ()=>Math.floor(Math.random()*90)+10);
  document.getElementById('arrInput').value = values.join(', ');
  buildChart(values.length);
  const maxVal = Math.max(...values,1);
  values.forEach((v,idx)=>{ barEls[idx].style.height = (12+(v/maxVal)*82)+'%'; valEls[idx].textContent = v; });
  updateStatus('Enter an array (or randomize one) and press Sort to begin.');
})();
</script>
</body>
</html>
